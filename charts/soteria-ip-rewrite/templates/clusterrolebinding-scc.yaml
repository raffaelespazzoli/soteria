{{- /*
ClusterRoleBinding — grants the SCC "use" ClusterRole to ServiceAccounts
in the release namespace (default) and any additional configured namespaces.
Only rendered when scc.enabled is true (OpenShift clusters).
*/ -}}
{{- if .Values.scc.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-scc-use" (include "soteria-ip-rewrite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria-ip-rewrite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-scc-use" (include "soteria-ip-rewrite.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ .Release.Namespace }}
  {{- range .Values.scc.namespaces }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ . }}
  {{- end }}
  {{- range .Values.scc.additionalSubjects }}
  - {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
