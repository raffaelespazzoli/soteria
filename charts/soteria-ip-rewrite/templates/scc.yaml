{{- /*
SecurityContextConstraints — OpenShift-specific resource that permits
the SYS_ADMIN capability required by the guestfish appliance inside
the IP rewrite init container.

This SCC is a superset of the kubevirt-controller SCC plus SYS_ADMIN.
OpenShift selects ONE SCC for an entire pod, so the SCC must cover all
capabilities, volume types, and seccomp profiles that virt-launcher pods
already require.

The only additional permission beyond kubevirt-controller is SYS_ADMIN,
which the guestfish appliance in the init container needs to mount and
modify guest disk images.

Only rendered when both scc.enabled and scc.create are true.
*/ -}}
{{- if and .Values.scc.enabled .Values.scc.create }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ printf "%s-ip-rewrite" (include "soteria-ip-rewrite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria-ip-rewrite.labels" . | nindent 4 }}
  annotations:
    soteria.io/description: "kubevirt-controller SCC + SYS_ADMIN for guestfish in IP rewrite init container"
allowedCapabilities:
  - SYS_ADMIN
  - NET_BIND_SERVICE
  - SYS_NICE
volumes:
  - '*'
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostPorts: false
allowHostPID: false
allowHostIPC: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
  - localhost/kubevirt/kubevirt.json
userNamespaceLevel: AllowHostLevel
{{- $namespaces := .Values.scc.namespaces | default list }}
{{- if not $namespaces }}
{{- $namespaces = list .Release.Namespace }}
{{- end }}
users:
{{- range $ns := $namespaces }}
{{- range $.Values.scc.serviceAccountNames }}
  - system:serviceaccount:{{ $ns }}:{{ . }}
{{- end }}
{{- end }}
{{- end }}
