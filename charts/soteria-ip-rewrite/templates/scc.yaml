{{- /*
SecurityContextConstraints — mirrors the kubevirt-controller SCC so that
virt-launcher pods with the IP rewrite init container satisfy SCC admission.

The init container runs as UID 107 (qemu), drops ALL capabilities, and
uses the KubeVirt seccomp profile. No capabilities beyond the existing
kubevirt-controller SCC (SYS_NICE, NET_BIND_SERVICE) are required:

  - libguestfs direct backend launches a user-mode QEMU appliance;
    filesystem operations happen inside the QEMU VM, not in the container.
  - A pre-built fixed appliance (LIBGUESTFS_PATH) avoids supermin at
    runtime, eliminating the need for root or SYS_ADMIN.
  - /dev/kvm is provided via the KubeVirt device plugin (resource limit),
    not via SYS_ADMIN or privileged mode.
  - CRI-O's RuntimeDefault seccomp on OpenShift already allows the
    unshare/mount/pivot_root syscalls that passt (libguestfs networking)
    needs, without requiring CAP_SYS_ADMIN.

Only rendered when both scc.enabled and scc.create are true.
*/ -}}
{{- if and .Values.scc.enabled .Values.scc.create }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ printf "%s-ip-rewrite" (include "soteria-ip-rewrite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria-ip-rewrite.labels" . | nindent 4 }}
  annotations:
    soteria.io/description: "Mirrors kubevirt-controller SCC for virt-launcher pods with IP rewrite init container"
allowedCapabilities:
  - NET_BIND_SERVICE
  - SYS_NICE
volumes:
  - '*'
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostPorts: false
allowHostPID: false
allowHostIPC: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
  - localhost/kubevirt/kubevirt.json
userNamespaceLevel: AllowHostLevel
{{- $namespaces := .Values.scc.namespaces | default list }}
{{- if not $namespaces }}
{{- $namespaces = list .Release.Namespace }}
{{- end }}
users:
{{- range $ns := $namespaces }}
{{- range $.Values.scc.serviceAccountNames }}
  - system:serviceaccount:{{ $ns }}:{{ . }}
{{- end }}
{{- end }}
{{- end }}
