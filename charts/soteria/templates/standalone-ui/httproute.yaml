{{- if and (eq .Values.ui.mode "standalone") .Values.ui.standalone.gateway.name }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-console-route" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-standalone
spec:
  parentRefs:
    - name: {{ .Values.ui.standalone.gateway.name }}
      namespace: {{ .Values.ui.standalone.gateway.namespace | default .Release.Namespace }}
  {{- with .Values.ui.standalone.gateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ printf "%s-standalone" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
          port: 8080
{{- end }}
