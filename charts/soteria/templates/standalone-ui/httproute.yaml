{{- if and (eq .Values.ui.mode "standalone") .Values.ui.standalone.gateway.name }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "soteria.fullname" . }}-console-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-standalone
spec:
  parentRefs:
    - name: {{ .Values.ui.standalone.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "soteria.fullname" . }}-standalone
          port: 8080
{{- end }}
