{{- if eq .Values.scylladb.mode "managed" }}
{{- /* Fail when joining a cluster without external seeds configured */ -}}
{{- if and (eq .Values.site.role "joining") (empty .Values.scylladb.managed.externalSeeds) }}
{{- fail "scylladb.managed.externalSeeds must not be empty when site.role=joining" }}
{{- end }}
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: {{ printf "%s-scylladb" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
{{/* NOTE: Cilium's service.cilium.io/global annotation must be applied to the
     headless Service created by the scylla-operator, not to the ScyllaCluster CR.
     The install script handles this post-install for Cilium networking mode. */}}
spec:
  version: {{ .Values.scylladb.managed.version | quote }}
  agentVersion: {{ .Values.scylladb.managed.agentVersion | quote }}
  developerMode: {{ .Values.scylladb.managed.developerMode }}
  exposeOptions:
    broadcastOptions:
      nodes:
        {{- if eq .Values.networking.mode "submariner" }}
        type: ServiceClusterIP
        {{- else if eq .Values.networking.mode "cilium" }}
        type: PodIP
        {{- end }}
      clients:
        {{- if eq .Values.networking.mode "submariner" }}
        type: ServiceClusterIP
        {{- else if eq .Values.networking.mode "cilium" }}
        type: PodIP
        {{- end }}
    nodeService:
      {{- if eq .Values.networking.mode "submariner" }}
      type: ClusterIP
      {{- else if eq .Values.networking.mode "cilium" }}
      type: Headless
      {{- end }}
  {{- with .Values.scylladb.managed.externalSeeds }}
  externalSeeds:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  datacenter:
    name: {{ required "scylladb.localDC is required when scylladb.mode=managed" .Values.scylladb.localDC }}
    racks:
      - name: {{ .Values.scylladb.managed.rack.name }}
        members: {{ .Values.scylladb.managed.members }}
        storage:
          capacity: {{ .Values.scylladb.managed.storage.capacity }}
          {{- with .Values.scylladb.managed.storage.storageClassName }}
          storageClassName: {{ . }}
          {{- end }}
        resources:
          {{- toYaml .Values.scylladb.managed.resources | nindent 10 }}
        scyllaConfig: scylla-config
        volumes:
          - name: certmanager-serving
            secret:
              secretName: scylladb-serving-tls
          - name: certmanager-ca
            secret:
              secretName: scylladb-serving-tls
              items:
                - key: ca.crt
                  path: ca-bundle.crt
          - name: combined-ca
            secret:
              secretName: scylladb-serving-tls
              items:
                - key: ca.crt
                  path: ca-bundle.crt
        volumeMounts:
          - name: certmanager-serving
            mountPath: /etc/scylla/certmanager-tls
            readOnly: true
          - name: certmanager-ca
            mountPath: /etc/scylla/certmanager-ca
            readOnly: true
          - name: combined-ca
            mountPath: /etc/scylla/combined-ca
            readOnly: true
{{- end }}
