{{- /*
Metrics serving Certificate — cert-manager issues a TLS cert for the
controller-manager metrics endpoint (port 8443).
Based on config/certmanager/metrics-serving-cert.yaml.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-metrics-serving" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  secretName: {{ printf "%s-metrics-server-cert" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  duration: 8760h
  renewBefore: 720h
  usages:
    - server auth
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - {{ printf "%s-metrics.%s.svc" (include "soteria.fullname" .) .Release.Namespace }}
    - {{ printf "%s-metrics.%s.svc.cluster.local" (include "soteria.fullname" .) .Release.Namespace }}
