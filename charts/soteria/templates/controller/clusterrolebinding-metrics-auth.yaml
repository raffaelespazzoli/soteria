{{- /*
Metrics Auth ClusterRoleBinding — binds metrics-auth ClusterRole to the controller SA.
Mirrors config/rbac/metrics_auth_role_binding.yaml.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-metrics-auth" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-metrics-auth" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soteria.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
