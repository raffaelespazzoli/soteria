apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-manager-rolebinding" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-manager-role" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soteria.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
