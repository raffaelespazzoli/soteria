{{- /*
ValidatingWebhookConfiguration — validates kubevirt.io/v1 VirtualMachines.
Mirrors config/webhook/manifests.yaml.
cert-manager injects the CA bundle from the webhook serving Certificate.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ printf "%s-validating-webhook" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ printf "%s-webhook-serving" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ printf "%s-webhook" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        namespace: {{ .Release.Namespace }}
        path: /validate-kubevirt-io-v1-virtualmachine
    failurePolicy: Fail
    matchPolicy: Exact
    name: vvm.kb.io
    rules:
      - apiGroups:
          - kubevirt.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - virtualmachines
    sideEffects: None
