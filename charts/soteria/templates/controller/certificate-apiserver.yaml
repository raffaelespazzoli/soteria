{{- /*
Apiserver serving Certificate — cert-manager issues a TLS cert for the
aggregated API server. The CA is injected into the APIService resource
via the cert-manager.io/inject-ca-from annotation.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-apiserver-serving" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  secretName: {{ printf "%s-apiserver-tls" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  duration: 8760h
  renewBefore: 720h
  commonName: {{ printf "%s-apiserver.%s.svc" (include "soteria.fullname" .) .Release.Namespace }}
  usages:
    - server auth
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - {{ printf "%s-apiserver.%s.svc" (include "soteria.fullname" .) .Release.Namespace }}
    - {{ printf "%s-apiserver.%s.svc.cluster.local" (include "soteria.fullname" .) .Release.Namespace }}
