{{- /*
Apiserver serving Certificate — cert-manager issues a TLS cert for the
aggregated API server. The CA is injected into the APIService resource
via the cert-manager.io/inject-ca-from annotation.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "soteria.fullname" . }}-apiserver-serving
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  secretName: {{ include "soteria.fullname" . }}-apiserver-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - {{ include "soteria.fullname" . }}-apiserver.{{ .Release.Namespace }}.svc
    - {{ include "soteria.fullname" . }}-apiserver.{{ .Release.Namespace }}.svc.cluster.local
