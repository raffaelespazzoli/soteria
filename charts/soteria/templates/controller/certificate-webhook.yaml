{{- /*
Webhook serving Certificate — cert-manager issues a TLS cert for the
admission webhook server. The CA is injected into the
ValidatingWebhookConfiguration via cert-manager.io/inject-ca-from.
Based on config/certmanager/webhook-serving-cert.yaml.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "soteria.fullname" . }}-webhook-serving
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  secretName: {{ include "soteria.fullname" . }}-webhook-server-cert
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - {{ include "soteria.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "soteria.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
