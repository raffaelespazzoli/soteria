{{- /*
Webhook serving Certificate — cert-manager issues a TLS cert for the
admission webhook server. The CA is injected into the
ValidatingWebhookConfiguration via cert-manager.io/inject-ca-from.
Based on config/certmanager/webhook-serving-cert.yaml.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-webhook-serving" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  secretName: {{ printf "%s-webhook-server-cert" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  duration: 8760h
  renewBefore: 720h
  usages:
    - server auth
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - {{ printf "%s-webhook.%s.svc" (include "soteria.fullname" .) .Release.Namespace }}
    - {{ printf "%s-webhook.%s.svc.cluster.local" (include "soteria.fullname" .) .Release.Namespace }}
