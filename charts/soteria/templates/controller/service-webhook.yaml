{{- /* Webhook Service — port 443→9443, matching config/webhook/service.yaml */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-webhook" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    {{- include "soteria.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
