{{- /*
Controller Deployment — single-binary aggregated API server + reconciler.
Mirrors config/manager/manager.yaml with conditional ScyllaDB wiring
based on scylladb.mode (managed | external).
*/ -}}
{{- include "soteria.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-controller-manager" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "soteria.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "soteria.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.controller.leaderElection.enabled }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --site-name={{ .Values.site.name }}
            - --secure-port={{ .Values.controller.apiserver.port }}
            - --tls-cert-file=/etc/soteria/apiserver-tls/tls.crt
            - --tls-private-key-file=/etc/soteria/apiserver-tls/tls.key
            - --disable-admission-plugins=ValidatingAdmissionPolicy,ValidatingAdmissionWebhook,MutatingAdmissionWebhook
            {{- if eq .Values.scylladb.mode "managed" }}
            - --scylladb-contact-points={{ printf "%s-scylladb-client.%s.svc:9142" (include "soteria.fullname" .) .Release.Namespace }}
            {{- else if eq .Values.scylladb.mode "external" }}
            - --scylladb-contact-points={{ .Values.scylladb.external.contactPoints }}
            {{- else }}
            {{- fail "scylladb.mode must be 'managed' or 'external'" }}
            {{- end }}
            - --scylladb-keyspace={{ .Values.scylladb.keyspace }}
            {{- with .Values.scylladb.localDC }}
            - --scylladb-local-dc={{ . }}
            {{- end }}
            {{- with .Values.scylladb.dcReplication }}
            - --scylladb-dc-replication={{ . }}
            {{- end }}
            {{- if eq .Values.scylladb.mode "managed" }}
            - --scylladb-tls-cert=/etc/soteria/scylladb-client-tls/tls.crt
            - --scylladb-tls-key=/etc/soteria/scylladb-client-tls/tls.key
            - --scylladb-tls-ca=/etc/soteria/scylladb-client-tls/ca.crt
            - --scylladb-tls-server-name={{ printf "%s-scylladb-client.%s.svc" (include "soteria.fullname" .) .Release.Namespace }}
            {{- end }}
            {{- if and (eq .Values.scylladb.mode "external") .Values.scylladb.external.tls.enabled }}
            - --scylladb-tls-cert=/etc/soteria/scylladb-tls/tls.crt
            - --scylladb-tls-key=/etc/soteria/scylladb-tls/tls.key
            - --scylladb-tls-ca=/etc/soteria/scylladb-tls/ca.crt
            {{- with .Values.scylladb.external.tls.serverName }}
            - --scylladb-tls-server-name={{ . }}
            {{- end }}
            {{- end }}
          image: "{{ .Values.controller.image.repository }}:{{ include "soteria.imageTag" (dict "tag" .Values.controller.image.tag "ctx" .) }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.controller.apiserver.port }}
              name: apiserver
              protocol: TCP
            - containerPort: 9443
              name: webhook
              protocol: TCP
            - containerPort: 8443
              name: metrics
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: apiserver-tls
              mountPath: /etc/soteria/apiserver-tls
              readOnly: true
            - name: webhook-server-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            - name: metrics-server-cert
              mountPath: /etc/soteria/metrics-tls
              readOnly: true
            {{- if eq .Values.scylladb.mode "managed" }}
            - name: scylladb-client-tls
              mountPath: /etc/soteria/scylladb-client-tls
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.scylladb.mode "external") .Values.scylladb.external.tls.enabled }}
            - name: scylladb-tls
              mountPath: /etc/soteria/scylladb-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: apiserver-tls
          secret:
            secretName: {{ printf "%s-apiserver-tls" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        - name: webhook-server-cert
          secret:
            secretName: {{ printf "%s-webhook-server-cert" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        - name: metrics-server-cert
          secret:
            secretName: {{ printf "%s-metrics-server-cert" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        {{- if eq .Values.scylladb.mode "managed" }}
        - name: scylladb-client-tls
          secret:
            secretName: {{ printf "%s-scylladb-client-tls" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        {{- end }}
        {{- if and (eq .Values.scylladb.mode "external") .Values.scylladb.external.tls.enabled }}
        - name: scylladb-tls
          secret:
            secretName: {{ .Values.scylladb.external.tls.secretName }}
        {{- end }}
      serviceAccountName: {{ include "soteria.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
