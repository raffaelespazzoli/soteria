{{- if eq .Values.ui.mode "console-plugin" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-console-plugin" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "soteria.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soteria.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-plugin
  template:
    metadata:
      labels:
        {{- include "soteria.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-plugin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-plugin
          image: "{{ .Values.ui.consolePlugin.image.repository }}:{{ include "soteria.imageTag" (dict "tag" .Values.ui.consolePlugin.image.tag "ctx" .) }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9443
              name: https
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: serving-cert
              mountPath: /var/serving-cert
              readOnly: true
            - name: nginx-tls-conf
              mountPath: /opt/app-root/etc/nginx.d
              readOnly: true
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ printf "%s-console-plugin-serving-cert" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
        - name: nginx-tls-conf
          configMap:
            name: {{ printf "%s-console-plugin-nginx" (include "soteria.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}
