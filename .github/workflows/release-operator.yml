name: release-operator
on:
  push:
    tags:
      - "v*"

# NOTE: Helm chart publishing is handled exclusively by release.yml using
# chart-releaser-action. If the reusable workflow below also publishes a
# Helm chart to gh-pages (via a helm-release job), its output will be
# overwritten by release.yml's publish-chart job. Both workflows use the
# "gh-pages" concurrency group to serialise writes, but only release.yml's
# chart package is canonical.

jobs:
  release:
    uses: redhat-cop/github-workflows-operators/.github/workflows/release-operator.yml@v1
    with:
      GO_VERSION: "1.25"
      BUILD_PLATFORMS: "linux/amd64,linux/arm64,linux/ppc64le"
      RUN_UNIT_TESTS: true
      OPERATOR_SDK_VERSION: "v1.42.2"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      COMMUNITY_OPERATOR_PAT: ${{ secrets.COMMUNITY_OPERATOR_PAT }}
