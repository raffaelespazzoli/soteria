# Release workflow: builds/pushes console-plugin & standalone-ui images, publishes Helm chart.
# The controller image is already handled by release-operator.yml via the reusable workflow.
name: release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Permissions scoped per-job below; workflow-level default is restrictive.
permissions: {}

env:
  REGISTRY: quay.io
  REGISTRY_ORG: soteria-project
  BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build and push console-plugin & standalone-ui container images
  # ------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version: $VERSION (tag must be v<semver>)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Console plugin image (console-plugin/Dockerfile, context: console-plugin/)
      - name: Build and push console-plugin image
        uses: docker/build-push-action@v6
        with:
          context: console-plugin/
          file: console-plugin/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/soteria-console-plugin:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_PRERELEASE == 'false' && format('{0}/{1}/soteria-console-plugin:latest', env.REGISTRY, env.REGISTRY_ORG) || '' }}

      # Standalone UI image (console-plugin/Dockerfile.standalone, context: repo root)
      - name: Build and push standalone-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: console-plugin/Dockerfile.standalone
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/soteria-standalone-ui:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_PRERELEASE == 'false' && format('{0}/{1}/soteria-standalone-ui:latest', env.REGISTRY, env.REGISTRY_ORG) || '' }}

  # ------------------------------------------------------------------
  # Job 2: Package and publish the Helm chart to GitHub Pages
  # NOTE: This is the canonical Helm chart publisher. If the reusable
  # workflow in release-operator.yml also publishes a Helm chart to
  # gh-pages, that job must be disabled to avoid race conditions.
  # ------------------------------------------------------------------
  publish-chart:
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version and appVersion
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/soteria/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/soteria/Chart.yaml
          grep -q "^version: ${VERSION}$" charts/soteria/Chart.yaml || { echo "::error::Chart.yaml version update failed"; exit 1; }
          grep -q "^appVersion: \"${GITHUB_REF_NAME}\"$" charts/soteria/Chart.yaml || { echo "::error::Chart.yaml appVersion update failed"; exit 1; }
          echo "Updated Chart.yaml:"
          cat charts/soteria/Chart.yaml

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          skip_existing: true
          mark_as_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
