# Release workflow: builds/pushes console-plugin & standalone-ui images, publishes Helm chart.
# The controller image is already handled by release-operator.yml via the reusable workflow.
name: release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REGISTRY: quay.io
  REGISTRY_ORG: soteria-project
  BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build and push console-plugin & standalone-ui container images
  # ------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Console plugin image (console-plugin/Dockerfile, context: console-plugin/)
      - name: Build and push console-plugin image
        uses: docker/build-push-action@v6
        with:
          context: console-plugin/
          file: console-plugin/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/soteria-console-plugin:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_PRERELEASE == 'false' && format('{0}/{1}/soteria-console-plugin:latest', env.REGISTRY, env.REGISTRY_ORG) || '' }}

      # Standalone UI image (console-plugin/Dockerfile.standalone, context: repo root)
      - name: Build and push standalone-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: console-plugin/Dockerfile.standalone
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/soteria-standalone-ui:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_PRERELEASE == 'false' && format('{0}/{1}/soteria-standalone-ui:latest', env.REGISTRY, env.REGISTRY_ORG) || '' }}

  # ------------------------------------------------------------------
  # Job 2: Package and publish the Helm chart to GitHub Pages
  # ------------------------------------------------------------------
  publish-chart:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version and appVersion
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" charts/soteria/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" charts/soteria/Chart.yaml
          echo "Updated Chart.yaml:"
          cat charts/soteria/Chart.yaml

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
