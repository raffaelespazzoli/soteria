# ---------------------------------------------------------------------------
# Release pipeline
# Triggered by pushing a semver tag (vX.Y.Z or vX.Y.Z-rc1).
#
# Job graph (maximises parallelism):
#
#   validate ─┬→ build-image (3 images × 4 platforms = 12 parallel) ─→ manifest-create ─┐
#             ├→ test ─→ helmchart-test ─────────────────────────────────────────────────├→ helm ──┬→ github-release
#             │                                                                          └→ docs ──┘
#             └──────────────────────────────────────────────────────────────────────────────────────┘
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: quay.io
  REGISTRY_ORG: raffaelespazzoli
  BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x

jobs:
  # ── 1. Validate the semver tag ──────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
      is_prerelease: ${{ steps.v.outputs.IS_PRERELEASE }}
    steps:
      - name: Derive version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag must be v<semver> (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Lint + unit + integration tests ──────────────────────────────────
  test:
    name: Lint & test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

      - name: Verify codegen
        run: hack/verify-codegen.sh

      - name: Run unit tests
        run: make test

      - name: Increase kernel limits for ScyllaDB
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.aio-max-nr=262144

      - name: Run integration tests (envtest)
        run: make integration-envtest

      - name: Run integration tests (ScyllaDB)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: make integration-scylladb

  # ── 3. Build per-platform images (3 images × 4 platforms in parallel) ───
  build-image:
    name: "Build ${{ matrix.image.name }} (${{ matrix.platform }})"
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: soteria
            context: "."
            file: Dockerfile
          - name: soteria-console-plugin
            context: console-plugin/
            file: console-plugin/Dockerfile
          - name: soteria-standalone-ui
            context: "."
            file: console-plugin/Dockerfile.standalone
        platform:
          - linux/amd64
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
        exclude:
          # node:22-slim has no s390x variant
          - image: { name: soteria-console-plugin }
            platform: linux/s390x
          - image: { name: soteria-standalone-ui }
            platform: linux/s390x
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: "${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ matrix.image.name }}:${{ needs.validate.outputs.version }}-${{ steps.platform.outputs.pair }}"
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ steps.platform.outputs.pair }}

  # ── 4. Create multi-arch manifests ──────────────────────────────────────
  manifest-create:
    name: Create multi-arch manifests
    needs: [validate, build-image, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create and push multi-arch manifests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          ALL_PLATFORMS="linux-amd64 linux-arm64 linux-ppc64le linux-s390x"
          # Node-based images have no s390x variant (node:22-slim is not published for s390x)
          NODE_PLATFORMS="linux-amd64 linux-arm64 linux-ppc64le"

          create_manifest() {
            local IMAGE=$1; shift
            local PLATFORMS="$@"
            local FULL="${REGISTRY}/${REGISTRY_ORG}/${IMAGE}"

            SOURCES=""
            for PLAT in $PLATFORMS; do
              SOURCES="${SOURCES} ${FULL}:${VERSION}-${PLAT}"
            done

            echo "::group::Creating manifest ${FULL}:${VERSION}"
            docker buildx imagetools create -t "${FULL}:${VERSION}" $SOURCES
            echo "::endgroup::"

            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "::group::Creating manifest ${FULL}:latest"
              docker buildx imagetools create -t "${FULL}:latest" $SOURCES
              echo "::endgroup::"
            fi
          }

          create_manifest soteria              $ALL_PLATFORMS
          create_manifest soteria-console-plugin $NODE_PLATFORMS
          create_manifest soteria-standalone-ui  $NODE_PLATFORMS

  # ── 5. Smoke-test the Helm chart on Kind ──────────────────────────────
  helmchart-test:
    name: Helm chart smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run Helm chart smoke test
        env:
          CONTAINER_TOOL: docker
          HELM_SMOKE_CLEANUP: "1"
        run: make helmchart-test

  # ── 6. Publish the Helm chart ───────────────────────────────────────────
  helm:
    name: Publish Helm chart
    needs: [validate, manifest-create, helmchart-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Stamp chart version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/soteria/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ github.ref_name }}\"/" charts/soteria/Chart.yaml
          echo "--- charts/soteria/Chart.yaml ---"
          cat charts/soteria/Chart.yaml

      - name: Lint chart
        run: helm lint charts/soteria

      - name: Template chart (dry-run validation)
        run: |
          helm template soteria charts/soteria \
            --set site.name=validation \
            --set scylladb.localDC=validation \
            --set controller.image.tag="${{ needs.validate.outputs.version }}" \
            > /dev/null

      - name: Package chart
        run: helm package charts/soteria --destination /tmp/chart-package

      - name: Prepare Helm repo directory
        run: |
          mkdir -p /tmp/helm-repo
          cp /tmp/chart-package/*.tgz /tmp/helm-repo/
          curl -sSfL "https://raffaelespazzoli.github.io/soteria/index.yaml" \
            -o /tmp/helm-repo/existing-index.yaml 2>/dev/null || true

      - name: Build repo index
        run: |
          if [ -f /tmp/helm-repo/existing-index.yaml ]; then
            helm repo index /tmp/helm-repo \
              --url "https://raffaelespazzoli.github.io/soteria" \
              --merge /tmp/helm-repo/existing-index.yaml
          else
            helm repo index /tmp/helm-repo \
              --url "https://raffaelespazzoli.github.io/soteria"
          fi
          rm -f /tmp/helm-repo/existing-index.yaml

      - name: Publish chart to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/helm-repo
          keep_files: true

      - name: Upload chart package artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/chart-package/*.tgz

  # ── 7. Publish documentation ────────────────────────────────────────────
  docs:
    name: Publish docs
    needs: [validate, manifest-create, helmchart-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

  # ── 8. Create GitHub Release ────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [validate, helm, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download chart package
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/chart-package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: /tmp/chart-package/*.tgz
