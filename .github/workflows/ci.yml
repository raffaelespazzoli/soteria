# ---------------------------------------------------------------------------
# CI pipeline — runs on every merge to main and on PRs targeting main.
#
# Job graph (all jobs run in parallel):
#   • test              – lint, codegen check, unit tests, integration tests
#   • build-soteria     – build controller image (multi-arch on main, amd64 on PR)
#   • build-console-plugin – build console-plugin image (same)
#   • build-standalone-ui  – build standalone-ui image (same)
#   • build-ip-rewrite  – build ip-rewrite init container (amd64 only, path-filtered)
#   • helmchart-test    – lint, template, deploy chart on Kind
#
# Docker layer caching via GHA backend (cache-from/to: type=gha) caches
# Go modules, Node packages, and compiled layers across runs.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PRs build amd64 only (fast feedback); merges to main build all arches
  BUILD_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/ppc64le' }}

jobs:
  # ── Lint + unit + integration tests ─────────────────────────────────────
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

      - name: Verify codegen
        run: hack/verify-codegen.sh

      - name: Run unit tests
        run: make test

      - name: Increase kernel limits for ScyllaDB
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.aio-max-nr=262144

      - name: Run integration tests (envtest)
        run: make integration-envtest

      - name: Run integration tests (ScyllaDB)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: make integration-scylladb

  # ── Build controller image ──────────────────────────────────────────────
  build-soteria:
    name: Build soteria image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
          tags: soteria:ci
          cache-from: type=gha,scope=soteria
          cache-to: type=gha,mode=max,scope=soteria

  # ── Build console-plugin image ──────────────────────────────────────────
  build-console-plugin:
    name: Build console-plugin image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: console-plugin/
          file: console-plugin/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
          tags: soteria-console-plugin:ci
          cache-from: type=gha,scope=console-plugin
          cache-to: type=gha,mode=max,scope=console-plugin

  # ── Build standalone-ui image ───────────────────────────────────────────
  build-standalone-ui:
    name: Build standalone-ui image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: console-plugin/Dockerfile.standalone
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
          tags: soteria-standalone-ui:ci
          cache-from: type=gha,scope=standalone-ui
          cache-to: type=gha,mode=max,scope=standalone-ui

  # ── Detect path changes for conditional jobs ─────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ip-rewrite: ${{ steps.filter.outputs.ip-rewrite }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ip-rewrite:
              - 'build/ip-rewrite/**'
              - 'internal/webhook/iprewrite/**'
              - 'cmd/ip-rewrite-webhook/**'
              - 'charts/soteria-ip-rewrite/**'

  # ── Build ip-rewrite init container image (single-arch) ──────────────
  build-ip-rewrite:
    name: Build ip-rewrite image
    needs: changes
    if: needs.changes.outputs.ip-rewrite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: build/ip-rewrite/
          file: build/ip-rewrite/Containerfile
          platforms: linux/amd64
          push: false
          tags: soteria-ip-rewrite:ci
          cache-from: type=gha,scope=ip-rewrite
          cache-to: type=gha,mode=max,scope=ip-rewrite

  # ── Build, deploy & smoke-test the Helm chart on Kind ─────────────────
  helmchart-test:
    name: Helm chart smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/soteria

      - name: Template chart (dry-run validation)
        run: |
          helm template soteria charts/soteria \
            --set site.name=validation \
            --set scylladb.localDC=validation \
            > /dev/null

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run Helm chart smoke test
        env:
          CONTAINER_TOOL: docker
          HELM_SMOKE_CLEANUP: "1"
        run: make helmchart-test
