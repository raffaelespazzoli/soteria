# ---------------------------------------------------------------------------
# CI pipeline — runs on every merge to main and on PRs targeting main.
#
# Job graph:
#   • test                    – lint, codegen check, unit tests, integration tests
#   • build-image-quick (PR)  – 3 parallel single-arch builds (fast feedback)
#   • build-image-full (main) – 3 images × 4 platforms = 12 parallel multi-arch
#   • helmchart-test          – lint, template, deploy chart on Kind
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint + unit + integration tests ─────────────────────────────────────
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

      - name: Verify codegen
        run: hack/verify-codegen.sh

      - name: Run unit tests
        run: make test

      - name: Increase kernel limits for ScyllaDB
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.aio-max-nr=262144

      - name: Run integration tests (envtest)
        run: make integration-envtest

      - name: Run integration tests (ScyllaDB)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: make integration-scylladb

  # ── PR only: 3 parallel single-arch builds (fast feedback) ──────────────
  build-image-quick:
    if: github.event_name == 'pull_request'
    name: "Build ${{ matrix.image.name }} (amd64)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: soteria
            context: "."
            file: Dockerfile
          - name: soteria-console-plugin
            context: console-plugin/
            file: console-plugin/Dockerfile
          - name: soteria-standalone-ui
            context: "."
            file: console-plugin/Dockerfile.standalone
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: false
          tags: "${{ matrix.image.name }}:ci"
          cache-from: type=gha,scope=${{ matrix.image.name }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-linux-amd64

  # ── Main only: 3 images × 4 platforms = 12 parallel multi-arch builds ───
  build-image-full:
    if: github.event_name == 'push'
    name: "Build ${{ matrix.image.name }} (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: soteria
            context: "."
            file: Dockerfile
          - name: soteria-console-plugin
            context: console-plugin/
            file: console-plugin/Dockerfile
          - name: soteria-standalone-ui
            context: "."
            file: console-plugin/Dockerfile.standalone
        platform:
          - linux/amd64
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: "${{ matrix.image.name }}:ci-${{ steps.platform.outputs.pair }}"
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ steps.platform.outputs.pair }}

  # ── Build, deploy & smoke-test the Helm chart on Kind ─────────────────
  helmchart-test:
    name: Helm chart smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/soteria

      - name: Template chart (dry-run validation)
        run: |
          helm template soteria charts/soteria \
            --set site.name=validation \
            --set scylladb.localDC=validation \
            > /dev/null

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run Helm chart smoke test
        env:
          CONTAINER_TOOL: docker
          HELM_SMOKE_CLEANUP: "1"
        run: make helmchart-test
