# RBD mirror bootstrap peer secret template.
#
# Template variables (substituted by envsubst):
#   ${PEER_SECRET_NAME} — name of the secret (e.g. rbd-mirror-peer-token-east)
#   ${PEER_TOKEN_B64}   — base64-encoded bootstrap peer token
#   ${PEER_POOL_B64}    — base64-encoded pool name (e.g. "mirrored-pool")
apiVersion: v1
kind: Secret
metadata:
  name: ${PEER_SECRET_NAME}
  namespace: rook-ceph
type: Opaque
data:
  token: ${PEER_TOKEN_B64}
  pool: ${PEER_POOL_B64}
