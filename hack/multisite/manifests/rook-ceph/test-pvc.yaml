# Test PVC for the replication smoke test.
#
# Template variables (substituted by envsubst):
#   ${TEST_NAMESPACE} — namespace for the test resources
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: ${TEST_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
