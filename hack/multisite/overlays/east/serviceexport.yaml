# MCS API ServiceExport for east's per-node headless service.
# With nodeService.type=Headless, the scylla-operator creates a headless
# service per node. Exporting it enables pod-specific DNS from west at
# <pod>.east.<svc>.<ns>.svc.clusterset.local.
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: soteria-scylladb-east-rack1-0
  namespace: soteria
