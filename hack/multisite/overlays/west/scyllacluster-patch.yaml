# West discovers east via Cilium Cluster Mesh DNS.
# The cluster.local FQDN resolves to ScyllaDB endpoints on east
# through Cilium Cluster Mesh endpoint synchronization.
- op: replace
  path: /spec/datacenter/name
  value: west
- op: replace
  path: /spec/externalSeeds
  value:
    - soteria-scylladb-east-rack1-0.soteria.svc.clusterset.local
