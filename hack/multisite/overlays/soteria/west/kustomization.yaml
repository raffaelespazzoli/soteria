# West cluster Soteria overlay — adds --site-name=west and --scylladb-local-dc=west.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - path: ../../west/manager-dc-patch.yaml
    target:
      kind: Deployment
      name: soteria-controller-manager
