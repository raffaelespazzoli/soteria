# Standalone console deployment for non-OCP environments (Minikube).
# Applied by deploy-soteria.sh; the CONSOLE_STANDALONE_IMG placeholder
# is replaced at deploy time.
---
apiVersion: v1
kind: Namespace
metadata:
  name: soteria-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soteria-console-standalone
  namespace: soteria-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: soteria-console-reader
rules:
  - apiGroups: ["soteria.io"]
    resources: ["drplans", "drexecutions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["soteria.io"]
    resources: ["drexecutions"]
    verbs: ["create", "patch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: soteria-console-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soteria-console-reader
subjects:
  - kind: ServiceAccount
    name: soteria-console-standalone
    namespace: soteria-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soteria-console-standalone
  namespace: soteria-console
  labels:
    app: soteria-console-standalone
    app.kubernetes.io/component: console-standalone
    app.kubernetes.io/part-of: soteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soteria-console-standalone
  template:
    metadata:
      labels:
        app: soteria-console-standalone
    spec:
      serviceAccountName: soteria-console-standalone
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-proxy
          image: CONSOLE_STANDALONE_IMG_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: soteria-console-standalone
  namespace: soteria-console
  labels:
    app: soteria-console-standalone
    app.kubernetes.io/component: console-standalone
    app.kubernetes.io/part-of: soteria
spec:
  type: LoadBalancer
  selector:
    app: soteria-console-standalone
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
