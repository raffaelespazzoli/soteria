# Reference MutatingWebhookConfiguration for the IP rewrite webhook.
# Story 18.6 (Helm Sub-Chart) will template this into a Helm chart with
# configurable namespace filtering and cert-manager annotation values.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: soteria-ip-rewrite
  annotations:
    # cert-manager injects the CA bundle from the referenced Certificate.
    # The namespace placeholder is replaced by the Helm chart (Story 18.6).
    cert-manager.io/inject-ca-from: "${NAMESPACE}/soteria-ip-rewrite-cert"
webhooks:
  - name: ip-rewrite.soteria.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: soteria-ip-rewrite-webhook
        namespace: system  # placeholder — Helm chart (18.6) will template this
        path: /mutate-v1-pod
    failurePolicy: Ignore
    sideEffects: None
    objectSelector:
      matchLabels:
        soteria.io/ip-rewrite: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
