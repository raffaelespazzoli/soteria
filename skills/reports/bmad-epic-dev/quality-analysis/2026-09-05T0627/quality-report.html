ic computation), and scripts/tests/test-epic-plan.py (tests). Frontmatter is well-formed. The pre-pass classified the skill as simple-utility due to the absence of numbered stage files, but the skill actually implements complex multi-phase orchestration via its reference file — a valid design choice.", "findings": [{"title": "Pre-pass type classification mismatch", "file": "workflow-integrity-prepass.json", "line": 0, "detail": "Pre-pass detected simple-utility because there are no numbered stage files at root. The skill is actually a complex orchestration workflow. Informational for pre-pass algorithm improvement.", "source": "workflow-integrity"}]}, "craft": {"assessment": "Strong overview quality at 23 lines establishing mission, domain framing, and role clarity. Excellent progressive disclosure — SKILL.md at 44 lines / 715 tokens is among the leanest orchestrator skills possible while phase-logic.md carries the full execution detail. The contract anchor at the top of phase-logic.md is a standout defensive design pattern.", "overview_quality": "appropriate", "progressive_disclosure": "good", "findings": [{"title": "Customization preamble repetition is structural necessity, not waste", "file": "references/phase-logic.md", "line": 80, "detail": "Each of the 4 templates runs in isolated subagent context, so the repeated preamble is required. Acknowledged as well-designed by the prompt-craft scanner.", "source": "prompt-craft"}]}, "cohesion": {"assessment": "Highly cohesive orchestration skill. Stage flow is logical — every phase builds on prior outputs. Parallelism strategy is carefully reasoned. The adversarial review contract is the most rigorous design element. Minor gaps in execution plan staleness after Phase A gate and cross-platform skill resolution.", "dimensions": {"stage_flow": {"score": "strong", "notes": "Clean linear top-level flow (Step 0 → A → B → Completion) with well-structured B sub-phases. No dead-end stages. B.7 elegantly closes the review-spawned story cycle."}, "purpose_alignment": {"score": "strong", "notes": "Promises match behavior. Design principles (orchestrator-not-implementer, fresh subagents, different review model, halt-on-failure) are consistently honored throughout."}, "complexity": {"score": "strong", "notes": "Complexity matches the task's decision space. epic-plan.py is a smart complexity reducer. B.6 sequential fallback adds necessary duplication."}, "gap_redundancy": {"score": "moderate", "notes": "Execution plan may be stale after Phase A gate. Cross-platform skill resolution is fragile. No concurrent-epic guard."}}, "findings": [{"title": "Execution plan may be stale after Phase A review gate", "file": "references/phase-logic.md", "line": 106, "detail": "User is invited to edit specs during the review gate, but the execution plan (dependency layers, story list) is not re-computed afterward.", "source": "skill-cohesion"}, {"title": "Cross-platform skill resolution fragility", "file": "references/phase-logic.md", "line": 80, "detail": "Sub-skills in .claude/skills/ resolved by name only from .cursor/skills/. If discovery mechanism changes, subagent prompts silently fail.", "source": "skill-cohesion"}, {"title": "B.6 sequential fallback positioned after B.5 but is an alternative execution mode", "file": "references/phase-logic.md", "line": 310, "detail": "Cosmetic positioning issue — B.6 is an alternative to B.1-B.5, not a stage that runs after B.5. Could confuse a weaker model.", "source": "skill-cohesion"}, {"title": "No concurrent-epic guard", "file": "references/phase-logic.md", "line": 18, "detail": "Nothing prevents running bmad-epic-dev for two epics simultaneously. Sprint-status.yaml is a shared file — concurrent writes could corrupt it.", "source": "enhancement-opportunities"}]}, "efficiency": {"assessment": "Well-optimized with dependency-layer parallelism, deterministic Python pre-pass, worktree-based isolation, and strict orchestrator-not-implementer contract. The main concern — parent context bloat from pre-reading diffs and specs — is addressed in the Orchestrator Context Bloat opportunity theme.", "findings": []}, "experience": {"assessment": "The skill serves a wide range of users with varying levels of friction. First-timers benefit from intent guards and execution plan displays but lack coaching at the review gate. Experts appreciate --commit-policy and --skip-confirmations but want phase-entry and parallelism controls. The biggest gap is automation support — three interaction points block headless execution.", "journeys": [{"archetype": "first-timer", "summary": "A developer new to BMad types 'implement epic 16' and encounters worktrees, model routing, and a review gate with no coaching on what to verify.", "friction_points": ["Worktree concept unexplained — extra directories appear with no context", "Review model auto-selection has no qualitative guidance", "Phase A review gate lists files but doesn't coach what to check"], "bright_spots": ["Intent guard catches single-story misfire elegantly", "Execution plan display educates on epic structure and parallelism", "Resume behavior means mistakes aren't catastrophic"]}, {"archetype": "expert", "summary": "A power user with pre-reviewed specs wants maximum throughput but must walk through Step 0 approval and an un-overridable review gate.", "friction_points": ["No phase-entry flag to skip to Phase B", "Phase A review gate is un-overridable even with --skip-confirmations", "No parallelism cap (--max-parallel) for resource-constrained environments", "Review cycle limit (2) is hard-coded, not configurable"], "bright_spots": ["--commit-policy=skip respects expert workflows", "--skip-confirmations removes most ceremony", "Worktree parallelism is genuinely fast"]}, {"archetype": "confused", "summary": "User types 'dev epic 13' but may have meant deploy, status check, or a different epic number entirely.", "friction_points": ["Intent guard only catches story-vs-epic confusion, not dev-vs-deploy", "No 'list available epics' helper when epic number is wrong", "No guard against accidental second invocation while subagents are running"], "bright_spots": ["Epic 'done' status detected immediately — cheap exit", "Intent guard for story references works well"]}, {"archetype": "edge-case", "summary": "Valid but unusual setups — circular dependencies, non-standard epic locations, unexpected story statuses — encounter silent failures.", "friction_points": ["Circular dependencies produce orphan layers silently", "Unknown-status stories silently skipped", "Multi-epic concurrent execution unguarded"], "bright_spots": ["DAG re-parse on resume handles partial completion", "Story status cross-referencing is thorough for known states"]}, {"archetype": "hostile-environment", "summary": "Git worktree failures, model outages, or disk issues create recovery cliffs.", "friction_points": ["Worktree creation failure recovery unspecified", "Merge conflict recovery is a documentation cliff", "Model unavailability mid-epic has no retry or fallback", "Python version mismatch possible with epic-plan.py"], "bright_spots": ["Sequential fallback (B.6) is well-documented", "Orphaned worktree detection on resume is thoughtful"]}, {"archetype": "automator", "summary": "CI pipeline runs the skill with --commit-policy=auto --skip-confirmations but stalls at the mandatory review gate.", "friction_points": ["Phase A review gate blocks all headless execution", "No structured exit artifact for CI consumption", "No timeout mechanism for hung subagents", "Commit message format is not configurable"], "bright_spots": ["--commit-policy and --skip-confirmations cover most automation needs", "Sprint-status checkpoint is inherently automation-friendly"]}], "autonomous": {"potential": "easily-adaptable", "notes": "Three targeted flags (--headless, --on-decision=fail, --clean-worktrees) plus a JSON exit summary would make the skill fully headless-capable. The state machine is already externalized in sprint-status.yaml; only interaction points need parameterization."}, "findings": [{"title": "Phase A review gate coaching would transform gate from ceremony to value", "file": "references/phase-logic.md", "line": 106, "detail": "A few bullets on what to verify (testable acceptance criteria, correct dependencies, scope alignment) would help first-timers use the gate effectively.", "source": "enhancement-opportunities"}]}, "scripts": {"assessment": "The existing epic-plan.py covers the heaviest deterministic block and is well-tested. However, ~1,970 tokens of additional deterministic work remain in the prompt layer — prompt rendering, review model resolution, sprint-status verification, git command construction, and worktree detection. A phased script buildout would eliminate this tax.", "token_savings": "~1,970 estimated total across 9 opportunities", "findings": [{"title": "Sprint-status verification at 3+ checkpoints could be scripted", "file": "references/phase-logic.md", "line": 100, "detail": "Re-reading sprint-status.yaml to verify state transitions at multiple checkpoints is deterministic. ~250 tokens savings.", "source": "script-opportunities"}, {"title": "Git diff command construction with exclude patterns", "file": "references/phase-logic.md", "line": 198, "detail": "Two diff command templates with static exclude patterns and variable substitution. ~150 tokens savings.", "source": "script-opportunities"}, {"title": "Git merge + cleanup command sequence", "file": "references/phase-logic.md", "line": 285, "detail": "Fixed 4-command sequence (checkout, merge, worktree remove, branch delete) with variable substitution. ~120 tokens savings.", "source": "script-opportunities"}, {"title": "Resume state→action mapping is a pure lookup table", "file": "references/phase-logic.md", "line": 361, "detail": "A 5-row state-to-action table that could be a required_action field in epic-plan.py output. ~100 tokens savings.", "source": "script-opportunities"}]}}, "recommendations": [{"rank": 1, "action": "Add --headless automation mode (auto-approve specs, fail-fast on decisions, structured JSON exit artifact, auto-clean worktrees)", "resolves": 6, "effort": "medium"}, {"rank": 2, "action": "Build render-prompt.py for subagent prompt rendering — eliminate ~920 tokens of template boilerplate and delegate spec/diff reading to review subagents", "resolves": 7, "effort": "medium"}, {"rank": 3, "action": "Add iteration bounds to all loops — max_review_spawn_iterations (default 2), circular dependency detection in epic-plan.py, unknown-status story warnings", "resolves": 4, "effort": "low"}, {"rank": 4, "action": "Fix path references and self-containment gaps — add {project-root} prefix to 2 bare paths, add commit-policy definition to contract anchor, document model slug maintenance source", "resolves": 4, "effort": "low"}, {"rank": 5, "action": "Define merge conflict recovery — document exact manual recovery procedure, consider merge-conflict state in sprint-status, add partial-merge rollback guidance", "resolves": 3, "effort": "low"}, {"rank": 6, "action": "Extend epic-plan.py with --resolve-review-model, --check-worktrees, and per-story required_action fields", "resolves": 4, "effort": "low"}]}</script>
<script>
const RAW = JSON.parse(document.getElementById('report-data').textContent);
const DATA = normalize(RAW);

function normalize(d) {
  // Fix meta field variants
  if (d.meta) {
    d.meta.skill_name = d.meta.skill_name || d.meta.skill || d.meta.name || 'Unknown';
    d.meta.scanner_count = typeof d.meta.scanner_count === 'number' ? d.meta.scanner_count
      : Array.isArray(d.meta.scanners_run) ? d.meta.scanners_run.length
      : d.meta.scanner_count || 0;
  }
  // Fix strengths: plain strings → objects
  d.strengths = (d.strengths || []).map(s =>
    typeof s === 'string' ? { title: s, detail: '' } : { title: s.title || '', detail: s.detail || '' }
  );
  // Fix opportunities: title→name, findings_resolved→findings
  (d.opportunities || []).forEach(o => {
    o.name = o.name || o.title || '';
    o.finding_count = o.finding_count || (o.findings || o.findings_resolved || []).length;
    if (!o.findings && o.findings_resolved) o.findings = [];
    o.action = o.action || o.fix || '';
  });
  // Fix broken: description→detail, fix→action
  (d.broken || []).forEach(b => {
    b.detail = b.detail || b.description || '';
    b.action = b.action || b.fix || '';
  });
  // Fix recommendations: description→action
  (d.recommendations || []).forEach((r, i) => {
    r.action = r.action || r.description || '';
    r.rank = r.rank || i + 1;
  });
  // Fix journeys: persona→archetype, friction→friction_points
  if (d.detailed_analysis && d.detailed_analysis.experience) {
    d.detailed_analysis.experience.journeys = (d.detailed_analysis.experience.journeys || []).map(j => ({
      archetype: j.archetype || j.persona || j.name || 'Unknown',
      summary: j.summary || j.journey_summary || j.description || j.friction || '',
      friction_points: j.friction_points || (j.friction ? [j.friction] : []),
      bright_spots: j.bright_spots || (j.bright ? [j.bright] : [])
    }));
  }
  return d;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function init() {
  const m = DATA.meta;
  document.getElementById('skill-name').textContent = m.skill_name;
  document.getElementById('subtitle').innerHTML =
    `${esc(m.skill_path)} &bull; ${m.timestamp ? m.timestamp.split('T')[0] : ''} &bull; ${m.scanner_count || 0} scanners &bull; <a href="quality-report.md">Full Report &nearr;</a>`;

  document.getElementById('grade-area').innerHTML =
    `<div class="grade grade-${DATA.grade}">${esc(DATA.grade)}</div>`;
  document.getElementById('narrative').textContent = DATA.narrative || '';

  renderBroken();
  renderOpportunities();
  renderStrengths();
  renderRecommendations();
  renderDetailed();
}

function renderBroken() {
  const items = DATA.broken || [];
  if (!items.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Broken / Critical (${items.length})</span>`;
  html += `<div class="actions"><button class="btn btn-primary" onclick="event.stopPropagation();showBrokenPrompt()">Fix These</button></div>`;
  html += `</div><div class="section-body open">`;
  items.forEach(item => {
    const loc = item.file ? `${item.file}${item.line ? ':'+item.line : ''}` : '';
    html += `<div class="item">`;
    html += `<span class="badge badge-${item.severity || 'high'}">${esc(item.severity || 'high')}</span> `;
    if (loc) html += `<span class="item-file">${esc(loc)}</span>`;
    html += `<div class="item-title">${esc(item.title)}</div>`;
    if (item.detail) html += `<div class="item-desc">${esc(item.detail)}</div>`;
    if (item.action) html += `<div class="item-action"><strong>Fix:</strong> ${esc(item.action)}</div>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('broken-section').innerHTML = html;
}

function renderOpportunities() {
  const opps = DATA.opportunities || [];
  if (!opps.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Opportunities (${opps.length})</span>`;
  html += `</div><div class="section-body open">`;
  opps.forEach((opp, idx) => {
    html += `<div class="opp">`;
    html += `<div class="opp-header">`;
    html += `<span class="badge badge-${opp.severity || 'medium'}">${esc(opp.severity || 'medium')}</span>`;
    html += `<span class="opp-name">${idx+1}. ${esc(opp.name)}</span>`;
    html += `<span class="opp-count">${opp.finding_count || (opp.findings||[]).length} observations</span>`;
    html += `<button class="btn" onclick="toggleFindings(${idx})">Details</button>`;
    html += `<button class="btn btn-primary" onclick="showThemePrompt(${idx})">Fix This</button>`;
    html += `</div>`;
    html += `<div class="opp-desc">${esc(opp.description)}</div>`;
    if (opp.impact) html += `<div class="opp-impact">Impact: ${esc(opp.impact)}</div>`;
    html += `<div class="opp-findings" id="findings-${idx}">`;
    (opp.findings || []).forEach(f => {
      const loc = f.file ? `${f.file}${f.line ? ':'+f.line : ''}` : '';
      html += `<div class="opp-finding">`;
      html += `<strong>${esc(f.title)}</strong>`;
      if (loc) html += ` <span class="item-file">${esc(loc)}</span>`;
      if (f.source) html += ` <span class="source">[${esc(f.source)}]</span>`;
      if (f.detail) html += `<br>${esc(f.detail)}`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div>`;
  document.getElementById('opportunities-section').innerHTML = html;
}

function renderStrengths() {
  const items = DATA.strengths || [];
  if (!items.length) return;
  let html = `<div class="section"><div class="section-header" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Strengths (${items.length})</span>`;
  html += `</div><div class="section-body">`;
  items.forEach(s => {
    html += `<div class="strength-item"><div class="title">${esc(s.title)}</div>`;
    if (s.detail) html += `<div class="detail">${esc(s.detail)}</div>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('strengths-section').innerHTML = html;
}

function renderRecommendations() {
  const recs = DATA.recommendations || [];
  if (!recs.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Recommendations</span>`;
  html += `</div><div class="section-body open"><div class="recs">`;
  recs.forEach(r => {
    html += `<div class="rec">`;
    html += `<span class="rec-rank">#${r.rank}</span>`;
    html += `${esc(r.action)}`;
    if (r.resolves) html += ` <span class="rec-resolves">(resolves ${r.resolves} observations)</span>`;
    html += `</div>`;
  });
  html += `</div></div></div>`;
  document.getElementById('recommendations-section').innerHTML = html;
}

function renderDetailed() {
  const da = DATA.detailed_analysis;
  if (!da) return;
  const dims = [
    ['structure', 'Structure & Integrity'],
    ['craft', 'Craft & Writing Quality'],
    ['cohesion', 'Cohesion & Design'],
    ['efficiency', 'Execution Efficiency'],
    ['experience', 'User Experience'],
    ['scripts', 'Script Opportunities']
  ];
  let html = `<div class="section"><div class="section-header" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Detailed Analysis</span>`;
  html += `</div><div class="section-body">`;
  dims.forEach(([key, label]) => {
    const dim = da[key];
    if (!dim) return;
    html += `<div class="analysis-section"><h4>${label}</h4>`;
    if (dim.assessment) html += `<p>${esc(dim.assessment)}</p>`;
    if (dim.dimensions) {
      html += `<table style="width:100%;font-size:0.85rem;margin:0.5rem 0;border-collapse:collapse;">`;
      html += `<tr><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Dimension</th><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Score</th><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Notes</th></tr>`;
      Object.entries(dim.dimensions).forEach(([d, v]) => {
        if (v && typeof v === 'object') {
          html += `<tr><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(d.replace(/_/g,' '))}</td><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(v.score||'')}</td><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(v.notes||'')}</td></tr>`;
        }
      });
      html += `</table>`;
    }
    if (dim.journeys && dim.journeys.length) {
      dim.journeys.forEach(j => {
        html += `<div style="margin:0.5rem 0"><strong>${esc(j.archetype)}</strong>: ${esc(j.summary || j.journey_summary || '')}`;
        if (j.friction_points && j.friction_points.length) {
          html += `<ul style="color:var(--high);font-size:0.85rem;padding-left:1.25rem">`;
          j.friction_points.forEach(fp => { html += `<li>${esc(fp)}</li>`; });
          html += `</ul>`;
        }
        html += `</div>`;
      });
    }
    if (dim.autonomous) {
      const a = dim.autonomous;
      html += `<p><strong>Headless Potential:</strong> ${esc(a.potential||'')}`;
      if (a.notes) html += ` — ${esc(a.notes)}`;
      html += `</p>`;
    }
    (dim.findings || []).forEach(f => {
      const loc = f.file ? `${f.file}${f.line ? ':'+f.line : ''}` : '';
      html += `<div class="analysis-finding">`;
      if (f.severity) html += `<span class="badge badge-${f.severity}">${esc(f.severity)}</span> `;
      html += `${esc(f.title)}`;
      if (loc) html += ` <span class="item-file">${esc(loc)}</span>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('detailed-section').innerHTML = html;
}

// --- Interactions ---
function toggleSection(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function toggleFindings(idx) {
  document.getElementById('findings-'+idx).classList.toggle('open');
}

// --- Prompt Generation ---
function showThemePrompt(idx) {
  const opp = DATA.opportunities[idx];
  if (!opp) return;
  let prompt = `## Task: ${opp.name}\nSkill path: ${DATA.meta.skill_path}\n\n`;
  prompt += `### Problem\n${opp.description}\n\n`;
  prompt += `### Fix\n${opp.action}\n\n`;
  if (opp.findings && opp.findings.length) {
    prompt += `### Specific observations to address:\n\n`;
    opp.findings.forEach((f, i) => {
      const loc = f.file ? (f.line ? `${f.file}:${f.line}` : f.file) : '';
      prompt += `${i+1}. **${f.title}**`;
      if (loc) prompt += ` (${loc})`;
      if (f.detail) prompt += `\n   ${f.detail}`;
      prompt += `\n`;
    });
  }
  document.getElementById('modal-title').textContent = `Fix: ${opp.name}`;
  document.getElementById('modal-content').textContent = prompt.trim();
  document.getElementById('modal').classList.add('visible');
}

function showBrokenPrompt() {
  const items = DATA.broken || [];
  let prompt = `## Task: Fix Critical Issues\nSkill path: ${DATA.meta.skill_path}\n\n`;
  items.forEach((item, i) => {
    const loc = item.file ? (item.line ? `${item.file}:${item.line}` : item.file) : '';
    prompt += `${i+1}. **[${(item.severity||'high').toUpperCase()}] ${item.title}**\n`;
    if (loc) prompt += `   File: ${loc}\n`;
    if (item.detail) prompt += `   Context: ${item.detail}\n`;
    if (item.action) prompt += `   Fix: ${item.action}\n`;
    prompt += `\n`;
  });
  document.getElementById('modal-title').textContent = 'Fix Critical Issues';
  document.getElementById('modal-content').textContent = prompt.trim();
  document.getElementById('modal').classList.add('visible');
}

function closeModal() { document.getElementById('modal').classList.remove('visible'); }

function copyModal() {
  const text = document.getElementById('modal-content').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.modal .btn-primary');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 1500);
  });
}

init();
</script>
</body>
</html>
